name: ext-vscode-test-e2e
"on":
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    name: Detect Changes
    outputs:
      e2e: ${{ steps.force.outputs.run_all == 'true' || steps.filter.outputs.e2e == 'true' }}
    steps:
      - id: force
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'run_all=true' -Encoding utf8NoBOM
        shell: pwsh
      - uses: actions/checkout@v4
        if: steps.force.outputs.run_all != 'true'
      - uses: dorny/paths-filter@v3
        if: steps.force.outputs.run_all != 'true'
        id: filter
        with:
          filters: |
            e2e:
                - 'apps/vscode/src/**'
                - 'apps/vscode/webview-ui/**'
                - 'apps/vscode/proto/**'
                - 'apps/vscode/tests/**'
                - 'apps/vscode/scripts/**'
                - 'apps/vscode/standalone/**'
                - 'apps/vscode/assets/**'
                - 'apps/vscode/walkthrough/**'
                - 'apps/vscode/package.json'
                - 'apps/vscode/webview-ui/package.json'
                # Root bun lockfile is authoritative for the whole workspace (incl. apps/vscode).
                - 'bun.lock'
                # SDK source packages are local workspace symlinks (@cline/*), so SDK changes affect the build.
                - 'sdk/packages/**'
                - 'apps/vscode/buf.yaml'
                - 'apps/vscode/tsconfig*.json'
                - 'apps/vscode/biome.jsonc'
                - 'apps/vscode/esbuild.mjs'
                - 'apps/vscode/bunfig.toml'
                - 'apps/vscode/.vscode-test.mjs'
                - 'apps/vscode/playwright*.ts'
                - '.github/workflows/ext-vscode-test-e2e.yml'
                - 'qbrain/build/**'
                - 'qbrain/verification/**'
  matrix_prep:
    needs: detect-changes
    if: needs.detect-changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |-
          $matrix = @(@{runner='ubuntu'}, @{runner='windows'}, @{runner='macos'})
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('matrix=' + (ConvertTo-Json -InputObject $matrix -Compress)) -Encoding utf8NoBOM
        shell: pwsh
  e2e:
    needs:
      - detect-changes
      - matrix_prep
    if: needs.detect-changes.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/vscode
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache VS Code
        uses: actions/cache@v4
        id: vscode-cache
        with:
          path: apps/vscode/.vscode-test
          key: vscode-${{ runner.os }}-stable-${{ hashFiles('apps/vscode/.vscode-test.mjs', 'apps/vscode/package.json') }}
      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: "& ./qbrain/build/Initialize-VscodeDependencies.ps1 -ReceiptDirectory '${{ runner.temp }}/cline-qb-dependencies'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build SDK packages
        working-directory: ${{ github.workspace }}
        run: bun --shell=bun run build:sdk
        shell: pwsh
      - name: Assert better-sqlite3 native binary present
        shell: pwsh
        run: |-
          $nodeFile = 'node_modules/better-sqlite3/build/Release/better_sqlite3.node'
          if (-not (Test-Path -LiteralPath $nodeFile -PathType Leaf)) {
              Write-Output "ERROR: better-sqlite3 native binary missing at apps/vscode/$nodeFile"
              Write-Output '(explicit native dependency preparation did not produce the required binary)'
              exit 1
          }
          Write-Output "Found better-sqlite3 native binary: $nodeFile"
      - name: Install xvfb on Linux
        if: matrix.runner == 'ubuntu'
        run: |-
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sudo apt-get install -y xvfb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
      - name: Prepare generated protocol sources
        shell: pwsh
        working-directory: apps/vscode
        run: node scripts/build-proto.mjs
      - name: Run E2E tests - Linux
        if: matrix.runner == 'ubuntu'
        shell: pwsh
        run: "& ../../qbrain/build/Invoke-VscodeGui.ps1 -Task 'test:e2e' -ReceiptDirectory '${{ runner.temp }}/cline-qb-e2e'"
      - name: Run E2E tests - Non-Linux
        if: matrix.runner != 'ubuntu'
        shell: pwsh
        run: "& ../../qbrain/build/Invoke-VscodeBuild.ps1 -Task 'test:e2e' -ReceiptDirectory '${{ runner.temp }}/cline-qb-e2e'"
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-recordings-${{ matrix.runner }}
          path: |
            apps/vscode/test-results/
