name: ext-vscode-test
"on":
  push:
    branches:
      - main
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
  workflow_call: {}
permissions:
  contents: read
  pull-requests: read
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    name: Detect Changes
    outputs:
      vscode: ${{ steps.force.outputs.run_all == 'true' || steps.filter.outputs.vscode == 'true' }}
      testing_platform: ${{ steps.force.outputs.run_all == 'true' || steps.filter.outputs.testing_platform == 'true' }}
    steps:
      - id: force
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        run: Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'run_all=true' -Encoding utf8NoBOM
        shell: pwsh
      - uses: actions/checkout@v4
        if: steps.force.outputs.run_all != 'true'
      - uses: dorny/paths-filter@v3
        if: steps.force.outputs.run_all != 'true'
        id: filter
        with:
          filters: |
            vscode:
                - 'apps/vscode/src/**'
                - 'apps/vscode/webview-ui/**'
                - 'apps/vscode/proto/**'
                - 'apps/vscode/tests/**'
                - 'apps/vscode/scripts/**'
                - 'apps/vscode/standalone/**'
                - 'apps/vscode/assets/**'
                - 'apps/vscode/walkthrough/**'
                - 'apps/vscode/package.json'
                - 'apps/vscode/webview-ui/package.json'
                # Root bun lockfile is authoritative for the whole workspace (incl. apps/vscode).
                - 'bun.lock'
                # SDK source packages are local workspace symlinks (@cline/*), so SDK changes affect the build.
                - 'sdk/packages/**'
                - 'apps/vscode/buf.yaml'
                - 'apps/vscode/tsconfig*.json'
                - 'apps/vscode/biome.jsonc'
                - 'apps/vscode/esbuild.mjs'
                - 'apps/vscode/bunfig.toml'
                - 'apps/vscode/.vscode-test.mjs'
                # ext-vscode-test-e2e builds without lint; list its Playwright config
                # here so Quality Checks lints it.
                - 'apps/vscode/playwright*.ts'
                - 'apps/vscode/test-setup.js'
                - '.github/workflows/ext-vscode-test.yml'
                - 'qbrain/build/**'
                - 'qbrain/verification/**'
            testing_platform:
                - 'apps/vscode/src/**'
                - 'apps/vscode/proto/**'
                - 'apps/vscode/standalone/**'
                - 'apps/vscode/testing-platform/**'
                - 'apps/vscode/testing-platform/package.json'
                - 'apps/vscode/tests/specs/**'
                - 'apps/vscode/package.json'
                # Root bun lockfile is authoritative for the whole workspace (incl. apps/vscode).
                - 'bun.lock'
                # SDK source packages are local workspace symlinks (@cline/*), so SDK changes affect the build.
                - 'sdk/packages/**'
                - 'apps/vscode/buf.yaml'
                - 'apps/vscode/tsconfig*.json'
                - 'apps/vscode/esbuild.mjs'
                - 'apps/vscode/.vscodeignore'
                - 'apps/vscode/scripts/**'
                - '.github/workflows/ext-vscode-test.yml'
                - 'qbrain/build/**'
                - 'qbrain/verification/**'
  quality-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.vscode == 'true' || needs.detect-changes.outputs.testing_platform == 'true'
    runs-on: ubuntu-latest
    name: Quality Checks
    defaults:
      run:
        working-directory: apps/vscode
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: "& ./qbrain/build/Initialize-VscodeDependencies.ps1 -ReceiptDirectory '${{ runner.temp }}/cline-qb-dependencies'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build SDK packages
        working-directory: ${{ github.workspace }}
        run: bun --shell=bun run build:sdk
        shell: pwsh
      - name: Assert better-sqlite3 native binary present
        run: |-
          $nodeFile = 'node_modules/better-sqlite3/build/Release/better_sqlite3.node'
          if (-not (Test-Path -LiteralPath $nodeFile -PathType Leaf)) {
              Write-Output "ERROR: better-sqlite3 native binary missing at apps/vscode/$nodeFile"
              Write-Output '(explicit native dependency preparation did not produce the required binary)'
              exit 1
          }
          Write-Output "Found better-sqlite3 native binary: $nodeFile"
        shell: pwsh
      - name: Prepare generated protocol sources
        shell: pwsh
        working-directory: apps/vscode
        run: node scripts/build-proto.mjs
      - name: Run Quality Checks (Parallel)
        shell: pwsh
        run: "& ../../qbrain/build/Invoke-VscodeBuild.ps1 -Task 'ci:check-all' -ReceiptDirectory '${{ runner.temp }}/cline-qb-quality'"
  vscode-test:
    needs:
      - detect-changes
      - quality-checks
    if: needs.detect-changes.outputs.vscode == 'true'
    env:
      VSCODE_TEST_VERSION: 1.101.0
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os == 'ubuntu-latest' && 'vscode test' || format('vscode test ({0})', matrix.os) }}
    defaults:
      run:
        shell: pwsh
        working-directory: apps/vscode
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: "& ./qbrain/build/Initialize-VscodeDependencies.ps1 -ReceiptDirectory '${{ runner.temp }}/cline-qb-dependencies'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build SDK packages
        working-directory: ${{ github.workspace }}
        run: bun --shell=bun run build:sdk
        shell: pwsh
      - name: Assert better-sqlite3 native binary present
        run: |-
          $nodeFile = 'node_modules/better-sqlite3/build/Release/better_sqlite3.node'
          if (-not (Test-Path -LiteralPath $nodeFile -PathType Leaf)) {
              Write-Output "ERROR: better-sqlite3 native binary missing at apps/vscode/$nodeFile"
              Write-Output '(explicit native dependency preparation did not produce the required binary)'
              exit 1
          }
          Write-Output "Found better-sqlite3 native binary: $nodeFile"
        shell: pwsh
      - name: Cache VS Code test runtime
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-runtime-${{ runner.os }}-${{ env.VSCODE_TEST_VERSION }}
      - name: Prepare generated protocol sources
        shell: pwsh
        working-directory: apps/vscode
        run: node scripts/build-proto.mjs
      - name: Build Tests and Extension
        id: build_step
        shell: pwsh
        run: "& ../../qbrain/build/Invoke-VscodeBuild.ps1 -Task 'ci:build' -ReceiptDirectory '${{ runner.temp }}/cline-qb-build'"
      - name: Vitest Suites (SDK adapter + model catalog)
        id: vitest_tests
        if: ${{ !cancelled() && steps.build_step.outcome == 'success' }}
        run: "& ../../qbrain/build/Invoke-VscodeCiTests.ps1 -Policy Vitest -ReceiptDirectory '${{ runner.temp }}/cline-qb-vitest'"
        shell: pwsh
      - name: Unit Tests (bun) - Linux
        id: unit_tests_linux
        if: ${{ !cancelled() && steps.build_step.outcome == 'success' && runner.os == 'Linux' }}
        run: "& ../../qbrain/build/Invoke-VscodeCiTests.ps1 -Policy Unit -ReceiptDirectory '${{ runner.temp }}/cline-qb-unit'"
        shell: pwsh
      - name: Unit Tests (bun) - Non-Linux
        id: unit_tests_non_linux
        if: ${{ !cancelled() && steps.build_step.outcome == 'success' && runner.os != 'Linux' }}
        run: "& ../../qbrain/build/Invoke-VscodeBuild.ps1 -Task 'test:unit' -ReceiptDirectory '${{ runner.temp }}/cline-qb-unit'"
        shell: pwsh
      - name: Extension Integration Tests - Linux
        id: integration_tests_linux
        if: ${{ !cancelled() && steps.build_step.outcome == 'success' && runner.os == 'Linux' }}
        run: "& ../../qbrain/build/Invoke-VscodeGui.ps1 -Task 'test:coverage' -ReceiptDirectory '${{ runner.temp }}/cline-qb-coverage'"
        shell: pwsh
      - name: Extension Integration Tests - Non-Linux
        id: integration_tests_non_linux
        if: ${{ !cancelled() && steps.build_step.outcome == 'success' && runner.os != 'Linux' }}
        run: "& ../../qbrain/build/Invoke-VscodeCiTests.ps1 -Policy IntegrationRetry -ReceiptDirectory '${{ runner.temp }}/cline-qb-integration'"
        shell: pwsh
      - name: Webview Tests with Coverage
        id: webview_tests
        if: ${{ !cancelled() && steps.build_step.outcome == 'success' }}
        run: "& ../../qbrain/build/Invoke-VscodeBuild.ps1 -Task 'test:webview:coverage' -ReceiptDirectory '${{ runner.temp }}/cline-qb-webview-coverage'"
        shell: pwsh
      - name: Save Coverage Reports
        uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: pr-coverage-reports
          path: |
            apps/vscode/webview-ui/coverage/lcov.info
  test-platform-integration:
    needs:
      - detect-changes
      - quality-checks
    if: needs.detect-changes.outputs.testing_platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vscode
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: "& ./qbrain/build/Initialize-VscodeDependencies.ps1 -ReceiptDirectory '${{ runner.temp }}/cline-qb-dependencies'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build SDK packages
        working-directory: ${{ github.workspace }}
        run: bun --shell=bun run build:sdk
        shell: pwsh
      - name: Assert better-sqlite3 native binary present
        run: |-
          $nodeFile = 'node_modules/better-sqlite3/build/Release/better_sqlite3.node'
          if (-not (Test-Path -LiteralPath $nodeFile -PathType Leaf)) {
              Write-Output "ERROR: better-sqlite3 native binary missing at apps/vscode/$nodeFile"
              Write-Output '(explicit native dependency preparation did not produce the required binary)'
              exit 1
          }
          Write-Output "Found better-sqlite3 native binary: $nodeFile"
        shell: pwsh
      - name: Download ripgrep binaries
        run: node scripts/qbrain/download-ripgrep.mjs
        shell: pwsh
      - name: Prepare generated protocol sources
        shell: pwsh
        working-directory: apps/vscode
        run: node scripts/build-proto.mjs
      - name: Compile Standalone
        shell: pwsh
        run: "& ../../qbrain/build/Invoke-VscodeBuild.ps1 -Task 'compile-standalone' -ReceiptDirectory '${{ runner.temp }}/cline-qb-standalone'"
      - name: Running testing platform integration spec tests
        timeout-minutes: 7
        run: "& ../../qbrain/build/Invoke-VscodeBuild.ps1 -Task 'test:tp-orchestrator' -ReceiptDirectory '${{ runner.temp }}/cline-qb-platform'"
        shell: pwsh
      - name: Save Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-platform-integration-core-coverage
          path: apps/vscode/coverage/**/lcov.info
  test:
    needs:
      - detect-changes
      - quality-checks
      - vscode-test
      - test-platform-integration
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    name: test
    steps:
      - name: Verify selected test jobs
        env:
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          QUALITY_CHECKS_RESULT: ${{ needs.quality-checks.result }}
          VSCODE_CHANGED: ${{ needs.detect-changes.outputs.vscode }}
          TESTING_PLATFORM_CHANGED: ${{ needs.detect-changes.outputs.testing_platform }}
          VSCODE_TEST_RESULT: ${{ needs.vscode-test.result }}
          TEST_PLATFORM_RESULT: ${{ needs.test-platform-integration.result }}
        run: |-
          if ($env:DETECT_CHANGES_RESULT -cne 'success') {
              Write-Output "detect-changes did not succeed: $env:DETECT_CHANGES_RESULT"
              exit 1
          }
          if ($env:VSCODE_CHANGED -cne 'true' -and $env:TESTING_PLATFORM_CHANGED -cne 'true') {
              Write-Output 'No root test paths changed; skipping root test requirements.'
              exit 0
          }
          if ($env:QUALITY_CHECKS_RESULT -cne 'success') {
              Write-Output "quality-checks did not succeed: $env:QUALITY_CHECKS_RESULT"
              exit 1
          }
          if ($env:VSCODE_CHANGED -ceq 'true' -and $env:VSCODE_TEST_RESULT -cne 'success') {
              Write-Output "vscode-test did not succeed: $env:VSCODE_TEST_RESULT"
              exit 1
          }
          if ($env:TESTING_PLATFORM_CHANGED -ceq 'true' -and $env:TEST_PLATFORM_RESULT -cne 'success') {
              Write-Output "test-platform-integration did not succeed: $env:TEST_PLATFORM_RESULT"
              exit 1
          }
          Write-Output 'Selected root test jobs passed.'
        shell: pwsh
  qlty:
    needs:
      - detect-changes
      - quality-checks
      - vscode-test
      - test-platform-integration
    if: ${{ !cancelled() && needs.quality-checks.result == 'success' && (needs.vscode-test.result == 'success' || needs.vscode-test.result == 'skipped') && (needs.test-platform-integration.result == 'success' || needs.test-platform-integration.result == 'skipped') && (needs.detect-changes.outputs.vscode == 'true' || needs.detect-changes.outputs.testing_platform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download unit tests coverage reports
        if: needs.detect-changes.outputs.vscode == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pr-coverage-reports
          path: apps/vscode
      - name: Upload core unit tests coverage to Qlty
        if: needs.detect-changes.outputs.vscode == 'true'
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: |
            apps/vscode/coverage-unit/lcov.info
          tag: unit:core
      - name: Upload webview-ui unit tests coverage to Qlty
        if: needs.detect-changes.outputs.vscode == 'true'
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: |
            apps/vscode/webview-ui/coverage/lcov.info
          tag: unit:webview-ui
          add-prefix: webview-ui/
      - name: Download test platform integration core coverage artifact
        if: needs.detect-changes.outputs.testing_platform == 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        id: download-integration-coverage
        with:
          name: test-platform-integration-core-coverage
          path: apps/vscode/integration-core-coverage-reports
      - name: Upload core integration tests coverage to Qlty
        if: needs.detect-changes.outputs.testing_platform == 'true' && steps.download-integration-coverage.outcome == 'success'
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: apps/vscode/integration-core-coverage-reports/**/lcov.info
          tag: integration:core
